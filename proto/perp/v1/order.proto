syntax = "proto3";

package perp.v1;

option go_package = "maas/backend/gen/perp/v1;perpv1";

// units: price = usdc 1e6 per 1 base, size = base 1e8.
// i128/u128 amounts = base-10 strings. trader = NEAR account id.

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_POST_ONLY = 3;
}

// subject: engine.in.order.<SYMBOL>. engine order id = ENGINE_IN stream seq.
message Order {
  string trader = 1;
  uint32 market = 2;
  Side side = 3;
  OrderType type = 4;
  TimeInForce tif = 5;
  // 0 = none (market order w/o worst-price guard)
  uint64 price = 6;
  uint64 size = 7;
  bool reduce_only = 8;
  uint64 nonce = 9;
  // unix ms
  uint64 expiry_ms = 10;
  string client_id = 11;
  // sha256(borsh(order)), 32 bytes
  bytes order_hash = 12;
  // 64-byte ed25519 sig over order_hash, verified by gateway
  bytes signature = 13;
  // 32-byte ed25519 trading key of trader
  bytes public_key = 14;
}

// subject: engine.in.cancel.<SYMBOL>
message Cancel {
  string trader = 1;
  uint32 market = 2;
  uint64 order_id = 3;
}
