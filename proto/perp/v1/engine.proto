syntax = "proto3";

package perp.v1;

import "perp/v1/order.proto";

option go_package = "maas/backend/gen/perp/v1;perpv1";

message Fill {
  uint32 market = 1;
  uint64 trade_id = 2;
  uint64 price = 3;
  uint64 size = 4;
  Side taker_side = 5;
  uint64 maker_order_id = 6;
  string maker = 7;
  uint64 taker_order_id = 8;
  string taker = 9;
}

// size = new level total, 0 = level gone
message BookDelta {
  uint32 market = 1;
  Side side = 2;
  uint64 price = 3;
  uint64 size = 4;
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_ACCEPTED = 1;
  ORDER_STATE_REJECTED = 2;
  ORDER_STATE_RESTING = 3;
  ORDER_STATE_PARTIALLY_FILLED = 4;
  ORDER_STATE_FILLED = 5;
  ORDER_STATE_CANCELLED = 6;
  ORDER_STATE_CANCEL_REJECTED = 7;
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  // rejects
  REASON_UNKNOWN_MARKET = 1;
  REASON_WRONG_MARKET = 2;
  REASON_ZERO_SIZE = 3;
  REASON_INVALID_LOT = 4;
  REASON_INVALID_TICK = 5;
  REASON_MISSING_PRICE = 6;
  REASON_INVALID_TIF = 7;
  REASON_DUPLICATE_ORDER_ID = 8;
  REASON_POST_ONLY_WOULD_CROSS = 9;
  REASON_REDUCE_ONLY_WOULD_INCREASE = 10;
  REASON_INSUFFICIENT_MARGIN = 11;
  REASON_MISSING_MARK = 12;
  // cancels
  REASON_USER = 20;
  REASON_UNFILLED = 21;
  REASON_SELF_TRADE = 22;
  REASON_REDUCE_ONLY = 23;
  // cancel rejects
  REASON_UNKNOWN_ORDER = 30;
  REASON_NOT_OWNER = 31;
}

message OrderStatus {
  uint32 market = 1;
  uint64 order_id = 2;
  string trader = 3;
  OrderState state = 4;
  Reason reason = 5;
  uint64 filled = 6;
  uint64 remaining = 7;
}

// subjects: engine.out.{fill,book,status}.<SYMBOL>. (input_seq, index) unique + ordered
message EngineOutput {
  uint64 input_seq = 1;
  uint32 index = 2;
  oneof event {
    Fill fill = 3;
    BookDelta book = 4;
    OrderStatus status = 5;
  }
}
